name: Keep QC React Test Preview Synced With LIVE

# GitHub scheduled workflows run from main. Always check out the operational
# Firebase/Supabase React branch, never the old migrate/react-typescript-vite.
# A production merge already publishes its exact build to LIVE and react-test.
# This weekly job only renews react-test before its preview URL expires.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: form-qc-unm-hosting-release
  cancel-in-progress: false

jobs:
  refresh-preview:
    if: github.repository == 'dnpuji24-bit/QC-Form-Web'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_QC_NATIVE_PORTAL: 'true'
      VITE_FIRESTORE_ENABLED: 'true'
      VITE_QC_FIRESTORE_ONLY: 'true'
      VITE_QC_MASTER_FIRESTORE: 'true'
      VITE_QC_OPERATIONAL_SAVE: 'true'
      VITE_QC_NATIVE_REGISTRATION: 'true'
      VITE_QC_PHOTO_SIGN_PREVIEW: 'true'
      VITE_QC_HOSTED_UAT: 'false'
      VITE_QC_SOURCE_BRANCH: 'feature/firebase-auth-claims-supabase'
      VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}

    steps:
      - name: Checkout active LIVE application source
        uses: actions/checkout@v4
        with:
          ref: feature/firebase-auth-claims-supabase

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Capture actual checkout revision (not default branch SHA)
        run: |
          echo "VITE_QC_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "VITE_QC_APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Validate source and print version
        run: |
          test "$VITE_QC_SOURCE_BRANCH" = 'feature/firebase-auth-claims-supabase'
          test -n "$VITE_RECAPTCHA_ENTERPRISE_SITE_KEY"
          npm run test:cutover:release-identity
          npm run test:cutover:native-report-print
          npm run typecheck

      - name: Build exact current React application
        run: |
          npm run build
          node scripts/write-qc-release-manifest.mjs
          test -s public/react/index.html
          test -s public/react/release.json

      - name: Refresh existing react-test preview (30 days)
        id: preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FORM_QC_UNM }}
          projectId: form-qc-unm
          channelId: react-test
          expires: 30d

      - name: Report exact preview build
        run: |
          echo "### QC React react-test (production backend)" >> "$GITHUB_STEP_SUMMARY"
          echo "Source branch: feature/firebase-auth-claims-supabase" >> "$GITHUB_STEP_SUMMARY"
          echo "Built SHA: $VITE_QC_BUILD_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: ${{ steps.preview.outputs.details_url }}/react/" >> "$GITHUB_STEP_SUMMARY"
