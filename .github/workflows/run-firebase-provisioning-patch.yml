name: Run Firebase Provisioning Patch

on:
  push:
    branches:
      - migrate/react-typescript-vite
    paths:
      - scripts/run-firebase-provisioning-patch.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migrate/react-typescript-vite
          fetch-depth: 0

      - name: Apply provisioning patch
        run: python scripts/apply_firebase_provisioning_patch.py

      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Code.gs FirebaseProvisioning.gs appsscript.json src/App.tsx src/types.ts
          git commit -m "Enable automatic Firebase provisioning and server mirror"
          git push origin HEAD:migrate/react-typescript-vite
