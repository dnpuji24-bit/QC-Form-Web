name: Deploy QC React to Firebase Hosting production

on:
  push:
    branches:
      - feature/firebase-auth-claims-supabase

permissions:
  contents: read

concurrency:
  group: form-qc-unm-hosting-release
  cancel-in-progress: false

jobs:
  verify-and-deploy-hosting:
    if: github.repository == 'dnpuji24-bit/QC-Form-Web'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_QC_NATIVE_PORTAL: 'true'
      VITE_FIRESTORE_ENABLED: 'true'
      VITE_QC_FIRESTORE_ONLY: 'true'
      VITE_QC_MASTER_FIRESTORE: 'true'
      VITE_QC_OPERATIONAL_SAVE: 'true'
      VITE_QC_NATIVE_REGISTRATION: 'true'
      VITE_QC_PHOTO_SIGN_PREVIEW: 'true'
      VITE_QC_HOSTED_UAT: 'false'
      VITE_QC_SOURCE_BRANCH: 'feature/firebase-auth-claims-supabase'
      VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
    steps:
      - name: Checkout production application branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install React dependencies
        run: npm install --no-audit --no-fund

      - name: Capture exact checkout revision and package version
        run: |
          echo "VITE_QC_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "VITE_QC_APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Validate production build configuration
        run: |
          test -n "$VITE_RECAPTCHA_ENTERPRISE_SITE_KEY"
          test "$VITE_QC_NATIVE_PORTAL" = 'true'
          test "$VITE_QC_FIRESTORE_ONLY" = 'true'
          test "$VITE_QC_OPERATIONAL_SAVE" = 'true'
          test "$VITE_QC_PHOTO_SIGN_PREVIEW" = 'true'

      - name: Report photo pagination regression
        run: npm run test:cutover:report-photo-pagination

      - name: Native A4 report printing regression
        run: npm run test:cutover:native-report-print

      - name: Check release identity and source alignment
        run: npm run test:cutover:release-identity

      - name: Validate Master Activity CoA and Monthly WO contracts
        run: npm run test:plan:wo-coa

      - name: Verify unified Activity register and historical safety
        run: npm run test:master:activity-unified

      - name: Validate Activity smartsearch matching and keyboard navigation
        run: npm run test:master:activity-smartsearch

      - name: Check Monthly WO input, Operation matching, and export
        run: npm run test:plan:monthly-wo-smartsearch

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Build production React application
        run: |
          npm run build
          node scripts/write-qc-release-manifest.mjs
          test -s public/react/index.html
          test -s public/react/sw.js
          test -s public/react/release.json

      - name: Confirm Firebase hosting credential configured
        env:
          FIREBASE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FORM_QC_UNM }}
        run: |
          test -n "$FIREBASE_ACCOUNT_JSON"
          echo "Firebase Hosting service account is configured."

      # New Firestore collections must be authorized before any frontend using them goes live.
      # If this step fails, LIVE/preview Hosting are not deployed.
      - name: Deploy CoA and WO Firestore security rules
        env:
          FIREBASE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FORM_QC_UNM }}
        run: |
          printf '%s' "$FIREBASE_ACCOUNT_JSON" > "$RUNNER_TEMP/qc-firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/qc-firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/qc-firebase-service-account.json"
          npx --yes firebase-tools@14 deploy --only firestore:rules --project form-qc-unm --non-interactive
          rm -f "$RUNNER_TEMP/qc-firebase-service-account.json"

      - name: Deploy only Hosting to form-qc-unm LIVE
        id: hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FORM_QC_UNM }}
          projectId: form-qc-unm
          channelId: live

      - name: Publish identical React build to react-test preview
        id: preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FORM_QC_UNM }}
          projectId: form-qc-unm
          channelId: react-test
          expires: 30d

      - name: Report deployment target
        run: |
          echo "### Production QC Form Web" >> "$GITHUB_STEP_SUMMARY"
          echo "https://form-qc-unm.web.app/react/" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview channel: react-test (same build as LIVE)" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Release metadata: https://form-qc-unm.web.app/react/release.json" >> "$GITHUB_STEP_SUMMARY"
