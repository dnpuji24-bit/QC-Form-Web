name: Apply Firestore First Stage 1

on:
  push:
    branches:
      - migrate/react-typescript-vite
    paths:
      - scripts/firestore_first_stage1.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migrate/react-typescript-vite
          fetch-depth: 0

      - name: Apply Firestore-first stage 1
        run: python scripts/apply_firestore_first_stage1.py

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/offline.ts src/SprayForm.tsx src/FertilizerForm.tsx src/App.tsx
          if git diff --cached --quiet; then
            echo "No source changes needed."
          else
            git commit -m "Make draft saves Firestore-first"
            git push origin HEAD:migrate/react-typescript-vite
          fi
