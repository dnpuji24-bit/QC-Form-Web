name: Firebase Hosting Preview

on:
  workflow_dispatch:
  push:
    branches:
      - migrate/react-typescript-vite
    paths:
      - '.github/workflows/firebase-preview.yml'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'firebase.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migrate/react-typescript-vite

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Build React
        run: npm run build

      - name: Verify React build output
        run: |
          test -f public/react/index.html
          test -f public/react/sw.js
          echo "React build output verified."

      - name: Deploy Firebase Hosting preview
        id: firebase_preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FORM_QC_UNM }}'
          projectId: form-qc-unm
          channelId: react-test
          expires: 7d

      - name: Show preview URL
        run: |
          echo "Preview details: ${{ steps.firebase_preview.outputs.details_url }}"
          echo "Hosting URL: ${{ steps.firebase_preview.outputs.url }}"
