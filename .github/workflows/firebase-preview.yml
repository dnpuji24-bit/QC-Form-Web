name: Firebase Hosting Preview

on:
  workflow_dispatch:
  push:
    branches:
      - migrate/react-typescript-vite
    paths:
      - '.github/workflows/firebase-preview.yml'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'firebase.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'scripts/patch_offline_session_persistence.py'

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migrate/react-typescript-vite
          fetch-depth: 0

      - name: Apply offline session persistence
        run: python scripts/patch_offline_session_persistence.py

      - name: Commit persistence changes when needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/App.tsx src/firebase.ts src/firebaseAuthBridge.ts tests/offline_session_persistence_check.py
            git commit -m "Keep QC session available across offline refresh"
            git push origin HEAD:migrate/react-typescript-vite
          else
            echo "Offline session persistence already applied."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Offline session regression check
        run: python tests/offline_session_persistence_check.py

      - name: TypeScript check
        run: npm run typecheck

      - name: Build React
        run: npm run build

      - name: Verify React build output
        run: |
          test -f public/react/index.html
          test -f public/react/sw.js
          echo "React build output verified."

      - name: Deploy Firebase Hosting preview
        id: firebase_preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FORM_QC_UNM }}'
          projectId: form-qc-unm
          channelId: react-test
          expires: 7d

      - name: Show preview URL
        run: |
          echo "Preview details: ${{ steps.firebase_preview.outputs.details_url }}"
          echo "Hosting URL: ${{ steps.firebase_preview.outputs.url }}"
