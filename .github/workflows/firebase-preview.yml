name: Firebase Hosting Preview (isolation preflight only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qc-hosting-uat

jobs:
  isolation-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only source inventory
        run: python scripts/audit-qc-uat-isolation.py
      - name: Report deployment hold
        run: |
          echo 'Hosted UAT deployment is blocked until Form QC UnM namespace isolation is verified.'
          echo 'No Firebase credentials, build, deployment or live writes were requested.'
