name: QC CoA and WO Pull Request Verification

on:
  pull_request:
    branches:
      - feature/firebase-auth-claims-supabase
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'firestore.rules'
      - 'package.json'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  verify-coa-wo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_QC_NATIVE_PORTAL: 'true'
      VITE_FIRESTORE_ENABLED: 'true'
      VITE_QC_FIRESTORE_ONLY: 'true'
      VITE_QC_MASTER_FIRESTORE: 'true'
      VITE_QC_OPERATIONAL_SAVE: 'true'
      VITE_QC_NATIVE_REGISTRATION: 'true'
      VITE_QC_PHOTO_SIGN_PREVIEW: 'true'
      VITE_QC_HOSTED_UAT: 'false'
      VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate CoA and WO contracts
        run: npm run test:plan:wo-coa
      - name: Verify unified Activity register and historical safety
        run: npm run test:master:activity-unified

      - name: Validate Activity smartsearch matching and keyboard navigation
        run: npm run test:master:activity-smartsearch

      - name: Check Monthly WO input, Operation matching, and export
        run: npm run test:plan:monthly-wo-smartsearch

      - name: Validate Daily WO-first and cross-shift planning
        run: npm run test:plan:daily-wo-first

      - name: Validate Daily WhatsApp layout and material totals
        run: npm run test:plan:daily-wa-layout

      - name: Validate Actual WO-first and independent shift
        run: npm run test:plan:actual-wo-first

      - name: Validate Actual WhatsApp layout and totals
        run: npm run test:plan:actual-wa-layout

      - name: Validate QC Spray and Fertilizer WO parity across shifts
        run: npm run test:qc:wo-shift-parity

      - name: Validate QC Multi-Paddock allocation and atomic Actual
        run: npm run test:qc:multi-paddock

      - name: Verify QC Multi-Paddock Firestore rules with mandor role in demo emulator
        run: |
          npm install --no-save --no-package-lock @firebase/rules-unit-testing@5
          npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-qc-multi-paddock --config firebase.native-cutover-browser-emulator.json "node scripts/test-qc-multi-paddock-rules-emulator.mjs"

      - name: Verify Unit Dispatch role and approval rules in emulator
        run: |
          npm install --no-save --no-package-lock @firebase/rules-unit-testing@5
          npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-qc-unit-dispatch --config firebase.native-cutover-browser-emulator.json "node scripts/test-unit-dispatch-rules-emulator.mjs"

      - name: Verify shared WO and ALL shifts in Firestore emulator
        run: |
          npm install --no-save --no-package-lock @firebase/rules-unit-testing@5
          npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-qc-shared-wo --config firebase.native-cutover-browser-emulator.json "node scripts/test-monthly-shared-wo-rules-emulator.mjs"

      - name: Verify TypeScript
        run: npm run typecheck
      - name: Build React safely
        run: npm run build
