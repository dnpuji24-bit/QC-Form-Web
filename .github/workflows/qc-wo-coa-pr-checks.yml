name: QC CoA and WO Pull Request Verification

on:
  pull_request:
    branches:
      - feature/firebase-auth-claims-supabase
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'firestore.rules'
      - 'package.json'
      - 'vite.config.ts'
      - 'public/react/sw.js'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  verify-coa-wo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_QC_NATIVE_PORTAL: 'true'
      VITE_FIRESTORE_ENABLED: 'true'
      VITE_QC_FIRESTORE_ONLY: 'true'
      VITE_QC_MASTER_FIRESTORE: 'true'
      VITE_QC_OPERATIONAL_SAVE: 'true'
      VITE_QC_NATIVE_REGISTRATION: 'true'
      VITE_QC_PHOTO_SIGN_PREVIEW: 'true'
      VITE_QC_HOSTED_UAT: 'false'
      VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate CoA and WO contracts
        run: npm run test:plan:wo-coa
      - name: Verify unified Activity register and historical safety
        run: npm run test:master:activity-unified

      - name: Validate Activity smartsearch matching and keyboard navigation
        run: npm run test:master:activity-smartsearch

      - name: Check Monthly WO input, Operation matching, and export
        run: npm run test:plan:monthly-wo-smartsearch

      - name: Validate Daily WO-first and cross-shift planning
        run: npm run test:plan:daily-wo-first

      - name: Validate Daily WhatsApp layout and material totals
        run: npm run test:plan:daily-wa-layout

      - name: Validate multiple unit support, per-requirement dispatch and WA physical codes
        run: node --experimental-strip-types --test scripts/test-daily-multi-unit-support.mjs

      - name: Validate Actual WO-first and independent shift
        run: npm run test:plan:actual-wo-first

      - name: Validate Actual WhatsApp layout and totals
        run: npm run test:plan:actual-wa-layout

      - name: Verify queued QC Firestore reconciliation and historical safety
        run: node --experimental-strip-types --test scripts/test-qc-pending-firestore-reconciliation.mjs

      - name: Validate QC Spray and Fertilizer WO parity across shifts
        run: npm run test:qc:wo-shift-parity

      - name: Validate QC Multi-Paddock allocation and atomic Actual
        run: npm run test:qc:multi-paddock

      - name: Verify QC Multi-Paddock Firestore rules with mandor role in demo emulator
        run: |
          npm install --no-save --no-package-lock @firebase/rules-unit-testing@5
          npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-qc-multi-paddock --config firebase.native-cutover-browser-emulator.json "node scripts/test-qc-multi-paddock-rules-emulator.mjs"

      - name: Verify Unit Dispatch role and direct-condition rules in emulator
        run: |
          npm install --no-save --no-package-lock @firebase/rules-unit-testing@5
          npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-qc-unit-dispatch --config firebase.native-cutover-browser-emulator.json "node scripts/test-unit-dispatch-rules-emulator.mjs"

      - name: Verify shared WO and ALL shifts in Firestore emulator
        run: |
          npm install --no-save --no-package-lock @firebase/rules-unit-testing@5
          npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-qc-shared-wo --config firebase.native-cutover-browser-emulator.json "node scripts/test-monthly-shared-wo-rules-emulator.mjs"

      - name: Validate Unit and Employee ODS import mapping
        run: node --experimental-strip-types --test scripts/test-resource-master-import.mjs

      - name: Verify Employee and Unit import Firestore permissions
        run: |
          npm install --no-save --no-package-lock @firebase/rules-unit-testing@5
          npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-qc-resource-import --config firebase.native-cutover-browser-emulator.json "node scripts/test-resource-master-import-rules-emulator.mjs"

      - name: Validate Excel-style Unit Grid and both shifts without approval
        run: node --experimental-strip-types --test scripts/test-unit-sheet-no-approval.mjs

      - name: Verify Users and Access Owner audit contract
        run: node --test scripts/test-native-users-access-contract.mjs

      - name: Verify Owner-only Users and Access writes in Firestore emulator
        run: |
          npm install --no-save --no-package-lock @firebase/rules-unit-testing@5
          npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-qc-native-owner-access --config firebase.native-cutover-browser-emulator.json "node scripts/test-native-owner-access-rules-emulator.mjs"

      - name: Verify safe Firebase Owner login diagnostics
        run: node --test scripts/test-qc-native-login-diagnostics.mjs

      - name: Verify resilient Owner profile read and Firestore quota diagnostics
        run: node --test scripts/test-owner-profile-firestore-availability.mjs

      - name: Verify offline menu lease and QC retry backoff
        run: node --test scripts/test-qc-offline-verified-menu.mjs

      - name: Verify Rekap BKM source aggregation
        run: node --test scripts/test-bkm-aggregation.mjs scripts/test-bkm-realization.mjs

      - name: Verify BKM report access in demo Firestore
        run: |
          npm install --no-save --no-package-lock @firebase/rules-unit-testing@5
          npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-qc-bkm --config firebase.native-cutover-browser-emulator.json "node scripts/test-bkm-rules-emulator.mjs"

      - name: Verify TypeScript
        run: npm run typecheck
      - name: Build React safely
        run: |
          npm run build
          node scripts/test-qc-offline-shell-build.mjs

  verify-offline-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application and demo Firebase dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix server/qc-photo-access install --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/qc-playwright" playwright --no-audit --no-fund
          "$RUNNER_TEMP/qc-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify first login, offline reload, reconnect and revoked role in demo browser
        run: |
          node scripts/test-qc-native-cutover-browser.mjs --self-test
          export QC_UAT_PLAYWRIGHT_DIR="$RUNNER_TEMP/qc-playwright"
          npx --yes firebase-tools@14 emulators:exec --only firestore,auth --project demo-qc-photo-test --config firebase.native-cutover-browser-emulator.json "env -u GOOGLE_CLOUD_PROJECT -u FIREBASE_PROJECT_ID -u QC_UAT_MODE GCLOUD_PROJECT=demo-qc-photo-test FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099 node scripts/test-qc-native-cutover-browser.mjs --browser"
