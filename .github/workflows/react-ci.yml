name: React migration checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [migrate/react-typescript-vite]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Regression checks
        run: |
          for test in tests/*_check.py; do
            echo "Running $test"
            python "$test"
          done

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vite production build
        run: npm run build

      - name: Apps Script runtime smoke
        if: github.event_name == 'push'
        env:
          SMOKE_OWNER_USERNAME: ${{ secrets.SMOKE_OWNER_USERNAME }}
          SMOKE_OWNER_PASSWORD: ${{ secrets.SMOKE_OWNER_PASSWORD }}
        run: node tests/runtime_smoke.mjs

      - name: Photo and role runtime smoke
        if: github.event_name == 'push'
        env:
          SMOKE_OWNER_USERNAME: ${{ secrets.SMOKE_OWNER_USERNAME }}
          SMOKE_OWNER_PASSWORD: ${{ secrets.SMOKE_OWNER_PASSWORD }}
        run: node tests/photo_role_smoke.mjs

      - name: Install browser smoke dependency
        if: github.event_name == 'push'
        run: npm install --no-save --no-audit --no-fund playwright-core

      - name: Browser offline and PWA smoke
        if: github.event_name == 'push'
        env:
          SMOKE_OWNER_USERNAME: ${{ secrets.SMOKE_OWNER_USERNAME }}
          SMOKE_OWNER_PASSWORD: ${{ secrets.SMOKE_OWNER_PASSWORD }}
        run: node tests/browser_offline_smoke.mjs
